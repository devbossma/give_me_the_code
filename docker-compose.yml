services:
  db:
    image: mysql:8.4
    container_name: give-me-the-code-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: givemethecode
      MYSQL_ROOT_PASSWORD: code123
    ports:
      - "3306:3306"
    volumes:
      - give-me-the-code-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pcode123"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  give-me-the-code-db-data:
